<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JarvisTEC</title>
  <style>
    /* UI de prueba: se reemplaza automáticamente por frontend/dist cuando exista el build de React. */
    :root { --fondo: #04101c; --acento: #31d0ff; --texto: #cfefff; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at center, #0a2740, var(--fondo) 70%);
      color: var(--texto); font-family: system-ui, sans-serif;
    }
    .nucleo {
      width: 180px; height: 180px; border-radius: 50%;
      border: 3px solid var(--acento); box-shadow: 0 0 40px var(--acento), inset 0 0 40px var(--acento);
      animation: pulso 2.4s ease-in-out infinite;
    }
    @keyframes pulso { 50% { transform: scale(1.06); box-shadow: 0 0 70px var(--acento), inset 0 0 60px var(--acento); } }
    main { text-align: center; }
    h1 { letter-spacing: .35em; color: var(--acento); font-weight: 300; }
    pre { text-align: left; background: #0008; padding: 1rem; border: 1px solid #31d0ff55; min-width: 22rem; }
  </style>
</head>
<body>
  <main>
    <div class="nucleo" style="margin: 0 auto 2rem"></div>
    <h1>JARVISTEC</h1>
    <p>UI de prueba · comprobando la API…</p>
    <pre id="estado">…</pre>
  </main>
  <script>
    const salida = document.getElementById('estado')
    Promise.all([fetch('/api/salud').then(r => r.json()), fetch('/api/modelos').then(r => r.json())])
      .then(([salud, { modelos }]) => {
        const entrenados = modelos.filter(m => m.entrenado).length
        salida.textContent = `API: ${salud.estado} (v${salud.version})\nModelos: ${modelos.length} registrados, ${entrenados} entrenados`
      })
      .catch(e => { salida.textContent = `Error al contactar la API: ${e}` })
  </script>
</body>
</html>
